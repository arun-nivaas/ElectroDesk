<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Proton Enterprise</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    
    <!-- Left Branding Panel -->
    <div class="panel-left">
      <div class="brand-header">Proton Enterprise</div>
      
      <h1 class="brand-title">High-performance electrical management for modern industrial ecosystems.</h1>
      
      <div class="brand-footer">
        <div class="established">Established 2024</div>
        <p class="quote">"Precision in every connection, power in every terminal."</p>
      </div>
    </div>

    <!-- Right Login Panel -->
    <div class="panel-right">
      <div class="auth-wrapper">
        
        <div class="auth-header">
          <h2 class="auth-title">Welcome Back</h2>
          <p class="auth-subtitle">Please enter your credentials to access the Proton terminal.</p>
        </div>

        <form id="login-form" novalidate>
          
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input type="text" id="username" name="username" class="input-field" placeholder="e.g. j.smith" required>
            </div>
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <div class="form-label">
              <label for="password">Password</label>
              <a href="#">Forgot?</a>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required>
              <button type="button" class="input-action toggle-password" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="error-message"></div>
          </div>

          <div class="form-group mt-4">
            <button type="submit" class="btn btn-primary">
              <span class="btn-text">Login to Terminal</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
              <span class="spinner"></span>
            </button>
          </div>

        </form>

        <div class="auth-footer">
          New to the enterprise? <a href="register.html">Create an Account</a>
        </div>

      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="js/ui.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
